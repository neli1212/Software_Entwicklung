name: Build Windows EXE

on: [push]

jobs:

  build-cpu:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision
          pip install transformers pillow opencv-python PySide6 pyinstaller

      - name: Build CPU EXE (single file)
        run: pyinstaller --noconfirm --onefile --windowed --name AISearchEngine-CPU --collect-all torch --collect-all transformers --collect-all huggingface_hub --collect-all cv2 main.py

      - name: Zip CPU Build (max compression)
        run: 7z a -mx9 AISearchEngine-CPU.zip ./dist/AISearchEngine-CPU.exe

      - name: Upload CPU Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISearchEngine-Windows-CPU
          path: AISearchEngine-CPU.zip

  build-cuda:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies (CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install transformers pillow opencv-python PySide6 pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121

      - name: Build CUDA EXE (single file, optimize)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name AISearchEngine-CUDA ^
            --collect-all torch --collect-all transformers --collect-all huggingface_hub --collect-all cv2 ^
            --exclude-module tkinter --exclude-module pandas --exclude-module numpy.distutils ^
            --strip --upx-dir . main.py

      - name: Zip CUDA Build (max compression)
        run: 7z a -mx9 AISearchEngine-CUDA.zip ./dist/AISearchEngine-CUDA.exe

      - name: Upload CUDA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISearchEngine-Windows-CUDA
          path: AISearchEngine-CUDA.zip

  release:
    needs: [build-cpu, build-cuda]
    runs-on: windows-latest
    steps:
      - name: Download CPU Artifact
        uses: actions/download-artifact@v4
        with:
          name: AISearchEngine-Windows-CPU

      - name: Download CUDA Artifact
        uses: actions/download-artifact@v4
        with:
          name: AISearchEngine-Windows-CUDA

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: build-${{ github.run_number }}
          name: AISearchEngine Build ${{ github.run_number }}
          files: |
            AISearchEngine-CPU.zip
            AISearchEngine-CUDA.zip