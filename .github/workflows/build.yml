name: Build Windows EXE

on:
  push:
    branches:
      - main  # or the branch you want to trigger builds from

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Optional: Build steps here (e.g., compile your EXE)
      # - name: Build EXE
      #   run: |
      #     echo "Insert build commands here"
      #     # e.g., msbuild, pyinstaller, etc.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: build-${{ github.run_number }}
          name: AISearchEngine Build ${{ github.run_number }}
          files: |
            AISearchEngine-CPU.zip
            AISearchEngine-CUDA.zip