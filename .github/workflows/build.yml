name: Build Windows EXE

on:
  push:
    branches:
      - main

jobs:
  build-cpu:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.6.0" torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers pillow opencv-python PySide6 pyinstaller
      - name: Build CPU EXE
        run: pyinstaller --noconfirm --onedir --windowed --name AISearchEngine-CPU --collect-all torch --collect-all transformers --collect-all huggingface_hub --collect-all cv2 main.py
      - name: Zip CPU Build
        run: 7z a AISearchEngine-CPU.zip ./dist/AISearchEngine-CPU/*
      - name: Upload CPU Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISearchEngine-Windows-CPU
          path: AISearchEngine-CPU.zip

  build-cuda:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.6.0" torchvision torchaudio --index-url https://download.pytorch.org/whl/cu124
          pip install transformers pillow opencv-python PySide6 pyinstaller
      - name: Build CUDA EXE
        run: pyinstaller --noconfirm --onedir --windowed --name AISearchEngine-CUDA --collect-all torch --collect-all transformers --collect-all huggingface_hub --collect-all cv2 main.py
      - name: Create Installer Script
        run: |
          $iss = @"
          [Setup]
          AppName="AISearchEngine"
          AppVersion="1.0"
          DefaultDirName="{autopf}\AISearchEngine"
          OutputDir="InstallerOutput"
          OutputBaseFilename="AISearchEngine-CUDA-Setup"
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "dist\AISearchEngine-CUDA\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\AISearchEngine"; Filename: "{app}\AISearchEngine-CUDA.exe"
          Name: "{commondesktop}\AISearchEngine"; Filename: "{app}\AISearchEngine-CUDA.exe"
          "@
          Set-Content -Path "installer.iss" -Value $iss -Encoding UTF8
      - name: Compile Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss
      - name: Upload CUDA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AISearchEngine-Windows-CUDA-Installer
          path: InstallerOutput\*

  release:
    needs: [build-cpu, build-cuda]
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Download CPU artifact
        uses: actions/download-artifact@v4
        with:
          name: AISearchEngine-Windows-CPU
      - name: Download CUDA Installer
        uses: actions/download-artifact@v4
        with:
          name: AISearchEngine-Windows-CUDA-Installer
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: v1.0.${{ github.run_number }}
          name: AISearchEngine Build ${{ github.run_number }}
          files: |
            AISearchEngine-CPU.zip
            AISearchEngine-CUDA-Setup.exe
            AISearchEngine-CUDA-Setup-1.bin