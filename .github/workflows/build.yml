name: Build Windows EXE

on: [push]

jobs:
  # ---------- CPU-Build ----------
  build-cpu:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision
          pip install transformers pillow opencv-python PySide6 pyinstaller

      - name: Build CPU EXE
        run: pyinstaller --noconfirm --onedir --windowed --name AISearchEngine-CPU --collect-all torch --collect-all transformers --collect-all huggingface_hub --collect-all cv2 main.py

      - name: Zip CPU Build
        run: 7z a AISearchEngine-CPU.zip ./dist/AISearchEngine-CPU/*

      - name: Upload CPU Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISearchEngine-Windows-CPU
          path: AISearchEngine-CPU.zip

  # ---------- CUDA-Build & Installer ----------
  build-cuda:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies (CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install transformers pillow opencv-python PySide6 pyinstaller
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121

      - name: Build CUDA EXE
        run: pyinstaller --noconfirm --onedir --windowed --name AISearchEngine-CUDA --collect-all torch --collect-all transformers --collect-all huggingface_hub --collect-all cv2 main.py

      - name: Create Inno Setup Script
        run: |
          $iss = @"
          [Setup]
          AppName=AISearchEngine CUDA
          AppVersion=1.0
          DefaultDirName={userlocalappdata}\AISearchEngine
          PrivilegesRequired=lowest
          OutputDir=InstallerOutput
          OutputBaseFilename=AISearchEngine-CUDA-Setup
          Compression=lzma2/ultra64
          SolidCompression=yes
          DiskSpanning=yes
          DiskSliceSize=1900000000

          [Files]
          Source: "dist\AISearchEngine-CUDA\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{userprograms}\AISearchEngine"; Filename: "{app}\AISearchEngine-CUDA.exe"
          "@
          Set-Content -Path "installer.iss" -Value $iss

      - name: Compile Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AISearchEngine-Windows-CUDA-Installer
          path: InstallerOutput\*

  # ---------- Release ----------
  release:
    needs: [build-cpu, build-cuda]
    runs-on: windows-latest
    permissions:
      contents: write 
    steps:
      - name: Download CPU artifact
        uses: actions/download-artifact@v4
        with:
          name: AISearchEngine-Windows-CPU
          path: release-files

      - name: Download CUDA Installer
        uses: actions/download-artifact@v4
        with:
          name: AISearchEngine-Windows-CUDA-Installer
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_PAT }}
          tag_name: build-${{ github.run_number }}
          name: AISearchEngine Build ${{ github.run_number }}
          files: release-files/*